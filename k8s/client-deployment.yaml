# ⚠️  Replace YOUR_AWS_ACCOUNT_ID and YOUR_AWS_REGION with real values

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cohort-client
  namespace: cohort
  labels:
    app: cohort-client
spec:
  replicas: 1    # Keep at 1 on t2.micro
  selector:
    matchLabels:
      app: cohort-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cohort-client
    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: cohort-client
          image: 381492190450.dkr.ecr.ap-south-1.amazonaws.com/cohort-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
